<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ومضات ذكية – تحليل المسوحات الصفية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&family=Noto+Sans+Hebrew:wght@400;600;700&display=swap">
<style>
/* Layout: one centered column of numbered work steps (instructions → setup → file → results), a calm "assessment office" palette: ink blue + paper, grade-band colors reserved for data. */
:root{
  --bg:#f5f6f3; --surface:#ffffff; --surface-2:#eef1ee; --fg:#1d2a33; --muted:#5b6a72; --line:#d9dfdb;
  --accent:#1f5f7a; --accent-ink:#ffffff; --accent-soft:#e2eef3;
  --warn-bg:#fff4dc; --warn-fg:#7a5300; --bad-bg:#fde6e4; --bad-fg:#9b2c22; --ok-bg:#e3f2e6; --ok-fg:#21602f;
  --b1:#d64545; --b2:#ef9a2b; --b3:#8bc34a; --b4:#2e7d32;
  --f-display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Hebrew",Tahoma,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Noto Sans Hebrew",Tahoma,Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121a1f; --surface:#19242b; --surface-2:#1f2d35; --fg:#e4ebee; --muted:#9aaab2; --line:#2e3f48;
  --accent:#6fb6d2; --accent-ink:#0d1a20; --accent-soft:#1d3742;
  --warn-bg:#3a2e12; --warn-fg:#f3cf7e; --bad-bg:#3d1f1c; --bad-fg:#f2a49b; --ok-bg:#1b3523; --ok-fg:#9fd7aa; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121a1f; --surface:#19242b; --surface-2:#1f2d35; --fg:#e4ebee; --muted:#9aaab2; --line:#2e3f48;
  --accent:#6fb6d2; --accent-ink:#0d1a20; --accent-soft:#1d3742;
  --warn-bg:#3a2e12; --warn-fg:#f3cf7e; --bad-bg:#3d1f1c; --bad-fg:#f2a49b; --ok-bg:#1b3523; --ok-fg:#9fd7aa; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65}
.hero{--navy:#0b1530;--gold:#e2be6a;--gold-2:#f6dfa0;background:radial-gradient(120% 140% at 50% 0%,#16285a 0%,var(--navy) 55%,#070d1f 100%);color:#f4ead2;padding-inline:16px;padding-block:18px 30px;position:relative}
.hero-in{max-width:980px;margin:0 auto;display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.logo{width:clamp(130px,22vw,200px);height:auto;border-radius:18px;box-shadow:0 0 0 1px rgba(226,190,106,.35),0 10px 40px rgba(226,190,106,.18)}
.hero-text{display:grid;gap:8px;min-width:0}
.hero h1{color:var(--gold);font-size:clamp(28px,4.6vw,44px);letter-spacing:0;text-shadow:0 0 22px rgba(226,190,106,.35)}
.hero .pname{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(17px,2.3vw,22px);color:var(--gold-2)}
.hero .welcome{margin:4px 0 0;max-width:62ch;color:#e6ddc6;font-size:15.5px}
.lang-switch{position:absolute;inset-block-start:12px;inset-inline-end:16px;display:flex;gap:4px;background:rgba(255,255,255,.07);border:1px solid rgba(226,190,106,.35);border-radius:999px;padding:3px}
.lang-switch button{font:inherit;font-size:13px;border:0;background:transparent;color:#f4ead2;padding:3px 11px;border-radius:999px;cursor:pointer}
.lang-switch button[aria-pressed="true"]{background:var(--gold);color:#0b1530;font-weight:700}
.intro{margin:0;max-width:75ch}
.foot{color:var(--muted);font-size:13px;text-align:center;padding-top:6px}
@media (max-width:620px){.hero-in{grid-template-columns:1fr;justify-items:center;text-align:center;padding-top:30px}.hero .welcome{margin-inline:auto}}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:28px 64px;display:grid;gap:22px}
h1{font-family:var(--f-display);font-size:clamp(26px,4vw,36px);line-height:1.25;margin:0;text-wrap:balance}
section.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px clamp(16px,3vw,28px);display:grid;gap:16px;min-width:0}
.step-head{display:flex;gap:14px;align-items:baseline}
.step-no{font-family:var(--f-display);font-weight:700;color:var(--accent);font-size:15px;min-width:2.2em;height:2.2em;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft)}
h2{font-family:var(--f-display);font-size:20px;margin:0;text-wrap:balance}
h3{font-size:16px;margin:0 0 6px}
.muted{color:var(--muted)}
.note{border-radius:8px;padding:12px 14px;display:grid;gap:4px}
.note.warn{background:var(--warn-bg);color:var(--warn-fg)}
.note.bad{background:var(--bad-bg);color:var(--bad-fg)}
.note.ok{background:var(--ok-bg);color:var(--ok-fg)}
.note.info{background:var(--accent-soft);color:var(--fg)}
.rules{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.rule{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:6px;align-content:start}
.rule b{font-size:15px}
code,.code{font-family:ui-monospace,Menlo,Consolas,monospace;direction:ltr;unicode-bidi:isolate;background:var(--surface-2);padding:1px 6px;border-radius:4px;font-size:13px}
.mini-table{border-collapse:collapse;font-size:13px;width:100%}
.mini-table td,.mini-table th{border:1px solid var(--line);padding:4px 8px;text-align:center;white-space:nowrap}
.mini-table th{background:var(--surface-2);font-weight:600}
.scroll{overflow-x:auto;min-width:0}
form{display:grid;gap:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px 18px}
label.f{display:grid;gap:5px;font-weight:500;font-size:14px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg);min-width:0;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible,.chip:focus-within{outline:2px solid var(--accent);outline-offset:2px}
fieldset{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:0;display:grid;gap:10px;min-width:0}
legend{font-weight:600;padding-inline:6px;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);cursor:pointer;font-size:14px;user-select:none}
.chip input{accent-color:var(--accent);margin:0}
.chip:has(input:checked){background:var(--accent-soft);border-color:var(--accent)}
.bands{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.band-pill{display:inline-flex;align-items:center;gap:6px;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:600;color:#1b1b1b}
.bound{display:inline-flex;align-items:center;gap:4px}
.bound input{width:68px;padding:5px 7px;text-align:center}
.btn{font:inherit;font-weight:600;border-radius:8px;padding:10px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.small{padding:5px 11px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px 16px;text-align:center;display:grid;gap:8px;justify-items:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{font-size:16px}
.detected{display:grid;gap:12px}
.sheet-list{display:grid;gap:8px}
.sheet-item{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.sheet-item select{width:auto;padding:4px 8px}
.skill-tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{background:var(--surface-2);border-radius:6px;padding:2px 9px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;gap:2px}
.kpi .v{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .l{font-size:13px;color:var(--muted)}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.chart-card{border:1px solid var(--line);border-radius:8px;padding:10px;display:grid;gap:6px;background:#fff;min-width:0}
.chart-card img{width:100%;height:auto;display:block}
.status{display:grid;gap:6px;font-size:14px}
.status .line{display:flex;gap:8px;align-items:center}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.dot.run{background:var(--b2);animation:pulse 1s infinite}
.dot.ok{background:var(--b4)}
.dot.err{background:var(--b1)}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.dot.run{animation:none}}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.dl-card{border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;align-content:start}
.badge{font-size:12px;font-weight:600;border-radius:5px;padding:1px 8px;background:var(--warn-bg);color:var(--warn-fg);width:fit-content}
details summary{cursor:pointer;font-weight:600}
ul.clean{margin:0;padding-inline-start:20px}
.legend-row{display:flex;flex-wrap:wrap;gap:8px}
</style>

const ANCH = ['#d64545', '#ef9a2b', '#8bc34a', '#2e7d32'];
function hex2rgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function rgb2hex(c) { return '#' + c.map(x => Math.round(x).toString(16).padStart(2, '0')).join(''); }
function bandColors(n) {
  if (n === 4) return ANCH.slice();
  const out = [];
  for (let i = 0; i < n; i++) { const t = n === 1 ? 1 : i / (n - 1) * 3; const k = Math.min(2, Math.floor(t)); const f = t - k; const a = hex2rgb(ANCH[k]), b = hex2rgb(ANCH[k + 1]); out.push(rgb2hex(a.map((x, j) => x + (b[j] - x) * f))); }
  return out;
}
function lighten(h, f = .6) { return rgb2hex(hex2rgb(h).map(x => x + (255 - x) * f)); }
function bandLabels(b) {
  const L = []; L.push('≤ ' + b[0]);
  for (let i = 1; i < b.length; i++) L.push(b[i - 1] + ' – ' + b[i]);
  L.push('> ' + b[b.length - 1]); return L;
}
function bandOf(x, b) { for (let i = 0; i < b.length; i++) if (x <= b[i]) return i; return b.length; }

function parseWorkbook(wb) {
  const out = { sheets: [], notes: [], key: null };
  // optional key sheet
  for (const name of wb.SheetNames) {
    if (RX.keySheet.test(name)) {
      const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true });
      const rows = aoa.filter(r => r && r.some(c => !isBlank(c)));
      const items = [];
      for (const r of rows) { const nums = r.map(toNum); const texts = r.filter(c => typeof c === 'string' && !NUMRE.test(c) && c.trim()); if (texts.length && nums.some(n => n != null)) { const mx = nums.filter(n => n != null); items.push({ skill: texts[0].trim(), sub: texts[1] ? texts[1].trim() : null, max: mx[mx.length - 1] }); } }
      if (items.length) { out.key = { name, items }; out.notes.push(['n_key', [name, items.length]]); }
    }
  }
  for (const name of wb.SheetNames) {
    if (out.key && name === out.key.name) continue;
    const aoa = XLSX.utils.sheet_to_json(wb.Sheets[name], { header: 1, defval: null, raw: true, blankrows: true });
    const r = parseSheet(name, aoa, out.key);

}
function parseSheet(name, aoa, key) {
  const notes = [];
  const width = Math.max(0, ...aoa.map(r => r ? r.length : 0));
  const rowInfo = aoa.map(r => { r = r || []; let num = 0, txt = 0, first = -1; for (let c = 0; c < width; c++) { const v = r[c]; if (isBlank(v)) continue; if (first < 0) first = c; if (toNum(v) != null) num++; else txt++; } return { num, txt, first }; });
  // candidate student rows: >=3 numeric cells
  const cand = rowInfo.map((ri, i) => ri.num >= 3 ? i : -1).filter(i => i >= 0);
  if (cand.length < 2) return null;
  // id column: leftmost column whose value is a non-numeric text in most candidate rows
  let idCol = -1;
  for (let c = 0; c < Math.min(width, 6); c++) {
    const cnt = cand.filter(i => { const v = (aoa[i] || [])[c]; return !isBlank(v) && toNum(v) == null; }).length;
    if (cnt >= cand.length * 0.6) { idCol = c; break; }
  }
  if (idCol < 0) { // ids may be numbers: use first column
    idCol = rowInfo[cand[0]].first;
    notes.push(['n_numIds']);
  }
  const isLabel = v => [RX.max, RX.skill, RX.sub, RX.question, RX.summaryRow].some(rx => rx.test(String(v)));
  const studentRows = cand.filter(i => { const v = (aoa[i] || [])[idCol]; return !isBlank(v) && !isLabel(v); });
  if (studentRows.length < 1) return null;
  const firstStu = studentRows[0];
  // header rows above first student row
  const hdr = [];
  for (let i = 0; i < firstStu; i++) if (rowInfo[i].num + rowInfo[i].txt > 0) hdr.push(i);
  const labelOf = i => { const r = aoa[i] || []; for (let c = 0; c <= idCol + 1 && c < width; c++) { const v = r[c]; if (typeof v === 'string' && v.trim() && !NUMRE.test(v)) return v.trim(); } return ''; };

    if (qRow < 0 && RX.question.test(lab)) { qRow = h; continue; }
  }
  if (qRow < 0) { const qre = /^\s*(س|ש|q|سؤال|שאלה|question)?\s*\.?\s*\d+[א-תa-zأ-ي]?\s*$/i; for (const h of hdr) { if (h === maxRow) continue; const vals = qCols.map(c => (aoa[h] || [])[c]); if (vals.every(v => typeof v === 'string' && qre.test(v))) { qRow = h; break; } } }
  // unlabeled text rows over question columns
  if (skillRow < 0) {
    const textRows = hdr.filter(h => h !== maxRow && h !== subRow && h !== qRow && qCols.filter(c => { const v = (aoa[h] || [])[c]; return typeof v === 'string' && v.trim() && toNum(v) == null; }).length >= qCols.length * 0.5);
    const rep = h => { const vals = qCols.map(c => String((aoa[h] || [])[c] ?? '').trim()).filter(Boolean); return vals.length - new Set(vals).size; };
    const withRep = textRows.filter(h => rep(h) > 0).sort((a, b) => rep(b) - rep(a));
    if (withRep.length) skillRow = withRep[0];
    else if (textRows.length && !RX.question.test(String((aoa[textRows[0]] || [])[qCols[0]] ?? ''))) skillRow = textRows[0];
  }
  if (maxRow < 0) { // unlabeled numeric row right above students
    for (const h of hdr) { const nums = qCols.map(c => toNum((aoa[h] || [])[c])); if (nums.every(n => n != null && n > 0)) { const ok = qCols.every((c, k) => studentRows.every(i => (toNum((aoa[i] || [])[c]) ?? 0) <= nums[k])); if (ok) { maxRow = h; break; } } }
  }
  // drop total columns
  qCols = qCols.filter(c => {
    const heads = hdr.map(h => (aoa[h] || [])[c]).filter(v => typeof v === 'string' && toNum(v) == null).map(String);
    if (heads.some(t => RX.total.test(t))) { notes.push(['n_totalCol', [heads.find(t => RX.total.test(t))]]); return false; }
    if (skillRow >= 0 && isBlank((aoa[skillRow] || [])[c]) && !key) { notes.push(['n_noSkillCol']); return false; }
    return true;
  });
  // sum column check
  if (qCols.length > 3) {
    const last = qCols[qCols.length - 1];
    const isSum = studentRows.filter(i => { const r = aoa[i] || []; const s = qCols.slice(0, -1).reduce((a, c) => a + (toNum(r[c]) || 0), 0); return Math.abs(s - (toNum(r[last]) || 0)) < 0.01; }).length >= studentRows.length * 0.8;
    if (isSum) { qCols.pop(); notes.push(['n_sumCol']); }
  }
  if (!qCols.length) return null;
  const questions = qCols.map((c, k) => {
    const sk = skillRow >= 0 ? (aoa[skillRow] || [])[c] : null;
    const sb = subRow >= 0 ? (aoa[subRow] || [])[c] : null;
    const ql = qRow >= 0 ? (aoa[qRow] || [])[c] : null;
    let mx = maxRow >= 0 ? toNum((aoa[maxRow] || [])[c]) : null;
    let skill = isBlank(sk) ? null : String(sk).trim();
    let sub = isBlank(sb) ? null : String(sb).trim();
    if (key && key.items[k]) { skill = skill || key.items[k].skill; sub = sub || key.items[k].sub; if (mx == null) mx = key.items[k].max; }
    return { col: c, label: isBlank(ql) ? String(k + 1) : String(ql).trim(), skill, sub, max: mx };
  });
  if (questions.some(q => q.max == null)) {
    questions.forEach(q => { if (q.max == null) { const obs = Math.max(0, ...studentRows.map(i => toNum((aoa[i] || [])[q.col]) || 0)); q.max = obs > 0 ? obs : 1; q.maxGuessed = true; } });
    notes.push(['n_noMax']);
  }
  if (questions.every(q => !q.skill)) { questions.forEach(q => q.skill = u('skGeneral')); notes.push(['n_noSkill']); }
  else questions.forEach(q => { if (!q.skill) q.skill = u('skUnclassified'); });
  const students = []; let absent = 0, clipped = 0, textVals = 0;
  for (const i of studentRows) {
    const r = aoa[i] || [];
    const raw = questions.map(q => r[q.col]);
    if (raw.every(isBlank)) { absent++; continue; }
    const scores = questions.map((q, k) => { const v = raw[k]; if (isBlank(v)) return 0; let n = toNum(v); if (n == null) { textVals++; n = 0; } if (n > q.max) { clipped++; n = q.max; } if (n < 0) n = 0; return n; });
    students.push({ id: String(r[idCol]).trim(), scores });
  }
  if (absent) notes.push(['n_absent', [absent]]);
  if (clipped) notes.push(['n_clipped', [clipped]]);
  if (textVals) notes.push(['n_text', [textVals]]);
  const nameLike = students.filter(s => /[؀-ۿ֐-׿a-zA-Z]{2,}\s+[؀-ۿ֐-׿a-zA-Z]{2,}/.test(s.id)).length;
  const topicDefault = subRow >= 0 ? subRow : (qRow >= 0 && qCols.some(c => { const v = String((aoa[qRow] || [])[c] ?? ''); return v.length > 4; })) ? qRow : skillRow;
  questions.forEach(q => { q.fileSkill = q.skill; q.fileSub = q.sub; });
  return { name, grade: detectGrade(name), questions, students, absent, notes, nameLike, aoa, hdr, topicDefault, width };
}

/* ====================== analysis ====================== */
function analyze(cfg, parsed, chosen) {
  const b = cfg.bounds, nb = b.length + 1;
  const classes = [];
  for (const sh of parsed.sheets) {
    if (!chosen.has(sh.name)) continue;
    const g = sh.gradeSel; if (!g) continue;
    const totMax = sh.questions.reduce((a, q) => a + q.max, 0);
    const skills = [...new Set(sh.questions.map(q => q.skill))];
    const skMax = Object.fromEntries(skills.map(s => [s, sh.questions.filter(q => q.skill === s).reduce((a, q) => a + q.max, 0)]));
    const studs = sh.students.map(st => {
      const tot = st.scores.reduce((a, x) => a + x, 0);
      const total = r1(tot / totMax * 100);
      const sk = {}; skills.forEach(s => { let got = 0; sh.questions.forEach((q, k) => { if (q.skill === s) got += st.scores[k]; }); sk[s] = r1(got / skMax[s] * 100); });
      return { id: st.id, scores: st.scores, total, band: bandOf(total, b), sk };
    });
    const totals = studs.map(s => s.total);
    const stats = { n: studs.length, mean: r1(mean(totals)), sd: r1(sdev(totals)), min: totals.length ? Math.min(...totals) : 0, max: totals.length ? Math.max(...totals) : 0 };
    const bandCounts = Array(nb).fill(0); studs.forEach(s => bandCounts[s.band]++);
    const skillPct = {}; skills.forEach(s => { const got = studs.reduce((a, st) => a + st.sk[s] * skMax[s] / 100, 0); skillPct[s] = studs.length ? r1(got / (skMax[s] * studs.length) * 100) : 0; });
    const qPct = sh.questions.map((q, k) => studs.length ? r1(studs.reduce((a, s) => a + s.scores[k], 0) / (q.max * studs.length) * 100) : 0);
    // support
    const support = [];
    studs.forEach(s => {
      const reasons = []; let pr = null;
      if (s.band === 0) { pr = 'high'; reasons.push('band0'); }
      else if (b.length > 1 && s.band === 1) { pr = 'medium'; reasons.push('band1'); }
      if (stats.sd > 0 && s.total < stats.mean - stats.sd) { reasons.push('belowSd'); pr = pr || 'medium'; }
      const weak = skills.filter(x => s.sk[x] < cfg.skLow);
      if (!pr && weak.length) { pr = 'medium'; reasons.push('weakSkill'); }
      if (pr) support.push({ id: s.id, total: s.total, gap: r1(s.total - stats.mean), weak, pr, reasons });
    });
    support.sort((x, y) => (x.pr === y.pr ? x.total - y.total : x.pr === 'high' ? -1 : 1));
    const excellent = studs.filter(s => s.band === nb - 1 && b[b.length - 1] >= 70).map(s => ({ id: s.id, total: s.total }));
    const weakBySkill = {}; skills.forEach(x => { weakBySkill[x] = studs.filter(s => s.sk[x] < cfg.skLow).map(s => ({ id: s.id, pct: s.sk[x] })).sort((a, c) => a.pct - c.pct); });
    classes.push({ name: sh.name, grade: g, questions: sh.questions, skills, skMax, totMax, students: studs, stats, bandCounts, skillPct, qPct, support, excellent, weakBySkill, absent: sh.absent });
  }
  classes.sort((a, c) => a.grade - c.grade || a.name.localeCompare(c.name, 'ar'));
  const grades = {};
  for (const c of classes) { (grades[c.grade] = grades[c.grade] || { grade: c.grade, classes: [] }).classes.push(c); }
  for (const G of Object.values(grades)) {
    const all = G.classes.flatMap(c => c.students);
    const totals = all.map(s => s.total);
    G.stats = { n: all.length, mean: r1(mean(totals)), sd: r1(sdev(totals)), min: totals.length ? Math.min(...totals) : 0, max: totals.length ? Math.max(...totals) : 0 };
    G.bandCounts = Array(nb).fill(0); all.forEach(s => G.bandCounts[s.band]++);
    G.skills = [...new Set(G.classes.flatMap(c => c.skills))];
    G.skillPct = {}; G.skills.forEach(s => { let got = 0, mx = 0; G.classes.forEach(c => { if (c.skMax[s] != null) { got += c.skillPct[s] / 100 * c.skMax[s] * c.stats.n; mx += c.skMax[s] * c.stats.n; } }); G.skillPct[s] = mx ? r1(got / mx * 100) : 0; });
    const q0 = G.classes[0].questions; const same = G.classes.every(c => c.questions.length === q0.length && c.questions.every((q, k) => q.skill === q0[k].skill));
    G.sameStructure = same;
    if (same) {
      G.qPct = q0.map((q, k) => { let got = 0, mx = 0; G.classes.forEach(c => { got += c.qPct[k] / 100 * q.max * c.stats.n; mx += q.max * c.stats.n; }); return mx ? r1(got / mx * 100) : 0; });
      const idx = q0.map((q, k) => k).sort((a, c) => G.qPct[a] - G.qPct[c]);
      G.hardest = idx.slice(0, 3).map(k => ({ label: q0[k].label, topic: q0[k].topic || '', skill: q0[k].skill, pct: G.qPct[k] }));
      G.easiest = idx.slice(-3).reverse().map(k => ({ label: q0[k].label, topic: q0[k].topic || '', skill: q0[k].skill, pct: G.qPct[k] }));
      G.questions = q0;
    }
    G.skillClass = s => G.skillPct[s] < cfg.skLow ? 'low' : G.skillPct[s] > cfg.skHigh ? 'high' : 'mid';
  }
  const gradeList = Object.values(grades).sort((a, c) => a.grade - c.grade);
  let subSkills = null;
  if (classes.some(c => c.questions.some(q => q.sub))) {
    subSkills = {};
    for (const G of gradeList) {
      const keys = []; const seen = new Set();
      G.classes.forEach(c => c.questions.forEach(q => { if (!q.sub) return; const k = q.skill + '|' + q.sub; if (!seen.has(k)) { seen.add(k); keys.push([q.skill, q.sub]); } }));
      subSkills[G.grade] = keys.map(([sk, sb]) => {
        const byClass = {}; let gotAll = 0, mxAll = 0;
        G.classes.forEach(c => { let got = 0, mx = 0; c.questions.forEach((q, k) => { if (q.skill === sk && q.sub === sb) { mx += q.max * c.stats.n; got += c.students.reduce((a, st) => a + st.scores[k], 0); } }); if (mx) { byClass[c.name] = r1(got / mx * 100); gotAll += got; mxAll += mx; } });
        return { skill: sk, sub: sb, byClass, all: mxAll ? r1(gotAll / mxAll * 100) : 0 };
      });
    }
  }
  const commonSkills = gradeList.length > 1 ? gradeList[0].skills.filter(s => gradeList.every(G => G.skills.includes(s))) : [];
  // pages / level
  const nClasses = classes.length, multiG = gradeList.length > 1;
  // page estimate (A4): a chart with its insights box ≈ ch(L) of a page; sections that start on a new page are rounded up
  const est = L => {
    const ch = L === 3 ? 0.6 : L === 2 ? 0.5 : 0.45; let p = (L > 1 ? 1 : 0) + 1; // cover + summary
    for (const G of gradeList) {
      let g = 2 * ch + (G.classes.length > 1 ? (L > 1 ? 3 : 2) * ch + 0.1 : 0) + (L === 1 ? 0.35 : 0);
      let cls = G.classes.length * (L === 3 ? 0.55 + 2 * ch : L === 2 ? 0.5 + ch : 0);
      p += L === 3 ? Math.ceil(g) + G.classes.reduce(a => a + Math.ceil(0.55 + 2 * ch), 0) : Math.ceil(g + cls);
    }
    if (multiG) p += Math.ceil(0.1 + (commonSkills.length ? 3 : 2) * ch);
    return p + 1; // general recommendations
  };
  let level = 3; while (level > 1 && est(level) > cfg.maxPages) level--;
  const bullets = level === 3 ? 4 : level === 2 ? 3 : 2;
  return { cfg, classes, grades: gradeList, commonSkills, subSkills, level, bullets, estPages: Math.ceil(est(level)), bandLabels: bandLabels(b), bandColors: bandColors(nb), nb };
}

    if (C.cross.skills) { kids.push(img(C.cross.skills, imgW)); kids.push(...box(I.cross.skills)); }
  }
  kids.push(H1(L.general));
  for (const [k, lab] of [['teacher', L.forTeacher], ['low', L.forLow], ['excellent', L.forExc], ['staff', L.forStaff], ['admin', L.forAdmin]]) {
    if (k === 'staff' && M.grades.length < 2 && M.classes.length < 2) continue;
    kids.push(P([run(lab, { bold: true, color: '1F5F7A' })], { before: 80, after: 40, keepNext: true }));
    (I.general[k] || []).forEach(t => kids.push(new D.Paragraph({ bidirectional: true, bullet: { level: 0 }, spacing: { after: 40 }, children: [run(t, { size: 21 })] })));
  }
  const footer = new D.Footer({ children: [new D.Paragraph({ bidirectional: true, alignment: D.AlignmentType.CENTER, border: { top: { style: D.BorderStyle.SINGLE, size: 4, color: 'BFC8C4', space: 4 } }, children: [run(cfg.footer, { size: 19, bold: true, color: '1F5F7A' }), run('     ', { size: 19 }), new D.TextRun({ children: [D.PageNumber.CURRENT], size: 19, font: FONT })] })] });
  const doc = new D.Document({
    creator: cfg.coord || 'survey', title: L.title(subjName),
    styles: { default: { document: { run: { font: 'Arial', size: 22, rightToLeft: true } } }, paragraphStyles: [
      { id: 'Heading1', name: 'Heading 1', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { size: 32, bold: true, color: '1F5F7A', rightToLeft: true }, paragraph: { bidirectional: true, spacing: { after: 160 } } },
      { id: 'Heading2', name: 'Heading 2', basedOn: 'Normal', next: 'Normal', quickFormat: true, run: { size: 26, bold: true, rightToLeft: true }, paragraph: { bidirectional: true, spacing: { before: 200, after: 100 } } }] },
    sections: [{ properties: { page: { size: { width: 11906, height: 16838 }, margin: { top: 1000, bottom: 1000, left: 1000, right: 1000, footer: 500 } } }, footers: { default: footer, first: footer }, children: kids }]
  });
  return D.Packer.toBlob(doc);
}

/* ====================== Excel (ExcelJS) ====================== */
async function buildXlsx(M, C, I, parsedNotes) {
  const L = T[M.cfg.lang], cfg = M.cfg, wb = new ExcelJS.Workbook();
  wb.creator = cfg.coord || 'survey';
  const argb = h => 'FF' + h.replace('#', '').toUpperCase();
  const fill = h => ({ type: 'pattern', pattern: 'solid', fgColor: { argb: argb(h) } });
  const thin = { style: 'thin', color: { argb: 'FFBFC8C4' } }; const BORD = { top: thin, bottom: thin, left: thin, right: thin };
  const HEADF = fill('#1F5F7A'); const HEADFont = { bold: true, color: { argb: 'FFFFFFFF' }, name: 'Arial', size: 11 };
  const bandFillH = i => lighten(M.bandColors[i], .55);
  const used = new Set();
  const sname = s => { let n = String(s).replace(/[\[\]:*?/\\]/g, ' ').slice(0, 31).trim() || 'Sheet'; let k = n, i = 2; while (used.has(k)) k = (n.slice(0, 28) + ' ' + i++); used.add(k); return k; };
  const sheet = (name, frozen = 0) => { const ws = wb.addWorksheet(sname(name), { views: [{ rightToLeft: true, state: frozen ? 'frozen' : 'normal', ySplit: frozen }], properties: { defaultColWidth: 14 } }); ws.properties.defaultRowHeight = 18; return ws; };
  const headRow = (ws, r, vals, c0 = 1) => { vals.forEach((v, i) => { const c = ws.getCell(r, c0 + i); c.value = v; c.fill = HEADF; c.font = HEADFont; c.border = BORD; c.alignment = { horizontal: 'center', vertical: 'middle', wrapText: true }; }); ws.getRow(r).height = 32; };
  const put = (ws, r, c, v, o = {}) => { const x = ws.getCell(r, c); x.value = v; x.border = BORD; x.alignment = { horizontal: o.left ? 'right' : 'center', vertical: 'middle', wrapText: !!o.wrap, readingOrder: 'rtl' }; x.font = { name: 'Arial', size: 11, bold: !!o.bold }; if (o.fill) x.fill = fill(o.fill); if (o.num) x.numFmt = o.num; return x; };
  const title = (ws, r, text, span = 8) => { ws.mergeCells(r, 1, r, span); const c = ws.getCell(r, 1); c.value = text; c.font = { name: 'Arial', size: 15, bold: true, color: { argb: 'FF1F5F7A' } }; c.alignment = { horizontal: 'right', vertical: 'middle', readingOrder: 'rtl' }; ws.getRow(r).height = 26; };
  const colA = n => { let s = ''; n++; while (n > 0) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; }; // 0-based → letter
  const bandCF = (ws, ref, tl) => { const rules = []; const b = cfg.bounds; M.bandLabels.forEach((_, i) => { const lo = i === 0 ? null : b[i - 1], hi = i < b.length ? b[i] : null; const cond = [`ISNUMBER(${tl})`, lo != null ? `${tl}>${lo}` : null, hi != null ? `${tl}<=${hi}` : null].filter(Boolean).join(','); rules.push({ type: 'expression', priority: i + 1, formulae: [`AND(${cond})`], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: argb(bandFillH(i)) } } } }); }); ws.addConditionalFormatting({ ref, rules }); };
  const skillCF = (ws, ref, tl) => ws.addConditionalFormatting({ ref, rules: [
    { type: 'expression', priority: 1, formulae: [`AND(ISNUMBER(${tl}),${tl}<${cfg.skLow})`], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFF8CBCB' } } } },
    { type: 'expression', priority: 2, formulae: [`AND(ISNUMBER(${tl}),${tl}>${cfg.skHigh})`], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFC6E5C8' } } } },
    { type: 'expression', priority: 3, formulae: [`ISNUMBER(${tl})`], style: { fill: { type: 'pattern', pattern: 'solid', bgColor: { argb: 'FFFCE3B6' } } } }] });
  const legend = (ws, r, c = 1) => { put(ws, r, c, L.legend, { bold: true, fill: '#E2EEF3' }); M.bandLabels.forEach((b, i) => put(ws, r, c + 1 + i, b, { fill: bandFillH(i), bold: true })); put(ws, r + 1, c, L.legendSkills, { bold: true, fill: '#E2EEF3' }); put(ws, r + 1, c + 1, `${L.lowS} < ${cfg.skLow}%`, { fill: '#F8CBCB' }); put(ws, r + 1, c + 2, L.midS, { fill: '#FCE3B6' }); put(ws, r + 1, c + 3, `${L.highS} > ${cfg.skHigh}%`, { fill: '#C6E5C8' }); return r + 3; };
  const addImg = (ws, ch, row, col, w = 640) => { const id = wb.addImage({ base64: ch.url, extension: 'png' }); const h = Math.round(ch.h * w / ch.w); ws.addImage(id, { tl: { col, row }, ext: { width: w, height: h } }); return Math.ceil(h / 20) + 2; };
  const bullets = (ws, r, head, items, span = 8) => { title(ws, r, head, span); r++; (items || []).forEach(t => { ws.mergeCells(r, 1, r, span); const c = ws.getCell(r, 1); c.value = '• ' + t; c.alignment = { wrapText: true, horizontal: 'right', vertical: 'top', readingOrder: 'rtl' }; c.font = { name: 'Arial', size: 11 }; ws.getRow(r).height = Math.max(20, Math.ceil(String(t).length / 95) * 17); r++; }); return r + 1; };

  // 1 notes
  let ws = sheet(L.sh.notes); ws.getColumn(1).width = 28; ws.getColumn(2).width = 90;
  title(ws, 1, L.title(L.subj[cfg.subject]), 2);
  let r = 3; put(ws, r, 1, L.settings, { bold: true, fill: '#E2EEF3' }); put(ws, r++, 2, '', { fill: '#E2EEF3' });
  [[L.subject, L.subj[cfg.subject]], [L.coord, cfg.coord], [L.assessor, cfg.assessor], [L.school, cfg.school], [L.date, cfg.date], [L.classesIncl, M.classes.map(c => c.name).join(', ')], [L.band, M.bandLabels.join('  |  ')], [L.legendSkills, `< ${cfg.skLow}% / ${cfg.skLow}–${cfg.skHigh}% / > ${cfg.skHigh}%`]].forEach(([k, v]) => { if (!v) return; put(ws, r, 1, k, { bold: true }); put(ws, r++, 2, v, { left: true, wrap: true }); });
  r++; put(ws, r, 1, L.assumptions, { bold: true, fill: '#E2EEF3' }); put(ws, r++, 2, '', { fill: '#E2EEF3' });
  parsedNotes.forEach(([sh, n]) => { put(ws, r, 1, sh); put(ws, r++, 2, noteText(cfg.lang, n), { left: true, wrap: true }); });
  put(ws, r, 1, '—'); put(ws, r++, 2, I.source === 'ai' ? L.aiNote : L.ruleNote, { left: true, wrap: true });
  r++; legend(ws, r);

  // 2 map questions → skills
  ws = sheet(L.sh.map, 1); headRow(ws, 1, [L.grade_, L.question, L.topic, L.skill, L.sub, L.fileSkill, L.maxScore]); [10, 10, 44, 32, 34, 26, 11].forEach((w, i) => ws.getColumn(i + 1).width = w);
  r = 2; for (const G of M.grades) { const qs = G.questions || G.classes[0].questions; qs.forEach(q => { put(ws, r, 1, L.gradeShort(G.grade)); put(ws, r, 2, q.label); put(ws, r, 3, q.topic || '', { left: true, wrap: true }); put(ws, r, 4, q.skill, { left: true, wrap: true }); put(ws, r, 5, q.sub || '', { left: true, wrap: true }); put(ws, r, 6, q.fileSkill || '', { left: true, wrap: true }); put(ws, r++, 7, q.max); }); }
  if (M.subSkills) {
    r += 1; title(ws, r++, L.subAnalysis, 7);
    for (const G of M.grades) { headRow(ws, r++, [L.grade_, L.skill, L.sub, ...G.classes.map(c => c.name), L.allGrade]); const s0 = r;
      (M.subSkills[G.grade] || []).forEach(x => { put(ws, r, 1, L.gradeShort(G.grade)); put(ws, r, 2, x.skill, { left: true, wrap: true }); put(ws, r, 3, x.sub, { left: true, wrap: true }); G.classes.forEach((c, i) => put(ws, r, 4 + i, x.byClass[c.name] ?? '—')); put(ws, r++, 4 + G.classes.length, x.all, { bold: true }); });
      if (r > s0) skillCF(ws, `D${s0}:${colA(3 + G.classes.length)}${r - 1}`, `D${s0}`); r++; }
  }

  // 3 class sheets
  for (const c of M.classes) {
    const qn = c.questions.length;
    ws = sheet(c.name, 3);
    title(ws, 1, `${L.classSection(c.name)} — ${L.grade(c.grade)}`, Math.min(qn + 3, 14));
    // row2: skills, row3: max ; header row 3? Layout: row2 skill names, row3 max, row4 header
    put(ws, 2, 1, L.skill, { bold: true, fill: '#E2EEF3' }); put(ws, 3, 1, L.maxScore, { bold: true, fill: '#E2EEF3' });
    c.questions.forEach((q, k) => { put(ws, 2, 2 + k, q.skill, { wrap: true, fill: '#F1F3F2' }); put(ws, 3, 2 + k, q.max, { bold: true, fill: '#F1F3F2' }); });
    ws.getRow(2).height = 60;
    // move freeze to below header row 4
    ws.views = [{ rightToLeft: true, state: 'frozen', ySplit: 4, xSplit: 1 }];
    headRow(ws, 4, [L.code, ...c.questions.map(q => q.label), L.total, L.band]);
    ws.getColumn(1).width = 12; for (let k = 0; k < qn; k++) ws.getColumn(2 + k).width = 11; ws.getColumn(qn + 2).width = 14; ws.getColumn(qn + 3).width = 12;
    const fL = colA(1), lL = colA(qn), totL = colA(qn + 1);
    c.students.forEach((s, i) => {
      const rr = 5 + i; put(ws, rr, 1, s.id, { bold: true });
      s.scores.forEach((v, k) => put(ws, rr, 2 + k, v));
      put(ws, rr, qn + 2, { formula: `ROUND(SUM(${fL}${rr}:${lL}${rr})/SUM($${fL}$3:$${lL}$3)*100,1)`, result: s.total }, { bold: true });
      put(ws, rr, qn + 3, M.bandLabels[s.band]);
    });
    const endR = 4 + c.students.length;
    if (c.students.length) bandCF(ws, `${totL}5:${totL}${endR}`, `${totL}5`);
    // per-question % row
    let rr = endR + 1;
    put(ws, rr, 1, L.success, { bold: true, fill: '#E2EEF3' });
    c.qPct.forEach((p, k) => put(ws, rr, 2 + k, p, { bold: true }));
    skillCF(ws, `${fL}${rr}:${lL}${rr}`, `${fL}${rr}`);
    put(ws, rr, qn + 2, { formula: `ROUND(AVERAGE(${totL}5:${totL}${endR}),1)`, result: c.stats.mean }, { bold: true });
    bandCF(ws, `${totL}${rr}:${totL}${rr}`, `${totL}${rr}`);
    rr += 2;
    // stats block
    const statRows = [[L.n, c.stats.n], [L.mean, c.stats.mean], [L.sd, c.stats.sd], [L.max, c.stats.max], [L.min, c.stats.min], [L.absent, c.absent || 0]];
    statRows.forEach(([k, v]) => { put(ws, rr, 1, k, { bold: true, fill: '#E2EEF3' }); put(ws, rr++, 2, v); });
    rr++;
    headRow(ws, rr, [L.band, L.count, L.pct]); rr++;
    M.bandLabels.forEach((b, i) => { put(ws, rr, 1, b, { fill: bandFillH(i), bold: true }); put(ws, rr, 2, c.bandCounts[i]); put(ws, rr++, 3, Math.round(c.bandCounts[i] / Math.max(1, c.stats.n) * 1000) / 10); });
    put(ws, rr, 1, '∑', { bold: true }); put(ws, rr++, 2, c.bandCounts.reduce((a, b) => a + b, 0), { bold: true });
    rr++;
    headRow(ws, rr, [L.skill, L.success, L.status]); ws.getColumn(1).width = 26; rr++;
    const s0 = rr;
    c.skills.forEach(s => { put(ws, rr, 1, s, { left: true, wrap: true }); put(ws, rr, 2, c.skillPct[s], { bold: true }); put(ws, rr++, 3, c.skillPct[s] < cfg.skLow ? L.lowS : c.skillPct[s] > cfg.skHigh ? L.highS : L.midS); });
    skillCF(ws, `B${s0}:B${rr - 1}`, `B${s0}`);
    rr = legend(ws, rr + 1);
    const cc = C.classes[c.name];
    rr += addImg(ws, cc.dist, rr, 0, 560);
    rr += addImg(ws, cc.skills, rr, 0, 600);
  }

  // 4 skills analysis
  ws = sheet(L.sh.skills, 0); r = 1;
  for (const G of M.grades) {
    title(ws, r, `${L.sh.skills} — ${L.grade(G.grade)}`, G.classes.length + 3); r += 1;
    headRow(ws, r, [L.skill, ...G.classes.map(c => c.name), L.allGrade, L.status]); r++;
    ws.getColumn(1).width = 34; for (let i = 2; i <= G.classes.length + 3; i++) ws.getColumn(i).width = Math.max(ws.getColumn(i).width || 0, 14);
    const r0 = r;
    G.skills.forEach(s => { put(ws, r, 1, s, { left: true, wrap: true }); G.classes.forEach((c, i) => put(ws, r, 2 + i, c.skillPct[s] ?? '—')); put(ws, r, G.classes.length + 2, G.skillPct[s], { bold: true }); put(ws, r++, G.classes.length + 3, G.skillPct[s] < cfg.skLow ? L.low : G.skillPct[s] > cfg.skHigh ? L.high : L.mid, { wrap: true }); });
    skillCF(ws, `B${r0}:${colA(G.classes.length + 1)}${r - 1}`, `B${r0}`);
    r++;
    if (G.hardest) {
      headRow(ws, r, [L.hardest, L.skill, L.success]); r++; G.hardest.forEach(q => { put(ws, r, 1, q.label); put(ws, r, 2, q.skill, { wrap: true }); put(ws, r++, 3, q.pct, { fill: '#F8CBCB' }); });
      headRow(ws, r, [L.easiest, L.skill, L.success]); r++; G.easiest.forEach(q => { put(ws, r, 1, q.label); put(ws, r, 2, q.skill, { wrap: true }); put(ws, r++, 3, q.pct, { fill: '#C6E5C8' }); });
      r++;
      headRow(ws, r, [L.question, ...G.classes.map(c => c.name), L.allGrade]); r++; const q0 = r;
      G.questions.forEach((q, k) => { put(ws, r, 1, `${q.label} · ${q.skill}`, { left: true, wrap: true }); G.classes.forEach((c, i) => put(ws, r, 2 + i, c.qPct[k])); put(ws, r++, G.classes.length + 2, G.qPct[k], { bold: true }); });
      skillCF(ws, `B${q0}:${colA(G.classes.length + 1)}${r - 1}`, `B${q0}`);
    }
    r = legend(ws, r + 1);
    r += addImg(ws, C.grades[G.grade].skills, r, 0, 620) + 1;
  }

  // 5 support
  ws = sheet(L.sh.support, 0); r = 1; [16, 14, 14, 16, 46, 14, 40].forEach((w, i) => ws.getColumn(i + 1).width = w);
  title(ws, r++, L.supportList, 7);
  headRow(ws, r++, [L.class, L.code, L.total, L.gap, L.weakSkills, L.priority, L.reasons]);
  const rTxt = { band0: L.rb0, band1: L.rb1, belowSd: L.rsd, weakSkill: L.rws };
  for (const c of M.classes) for (const s of c.support) { const pf = s.pr === 'high' ? '#F8CBCB' : '#FCE3B6'; put(ws, r, 1, c.name, { fill: pf }); put(ws, r, 2, s.id, { bold: true, fill: pf }); put(ws, r, 3, s.total, { fill: pf }); put(ws, r, 4, s.gap, { fill: pf }); put(ws, r, 5, s.weak.join(' · '), { wrap: true, fill: pf }); put(ws, r, 6, s.pr === 'high' ? L.prHigh : L.prMedium, { bold: true, fill: pf }); put(ws, r++, 7, s.reasons.map(x => rTxt[x]).join(' · '), { wrap: true, fill: pf }); }
  r++;
  for (const c of M.classes) for (const s of c.skills) { const lst = c.weakBySkill[s]; if (!lst.length || c.skillPct[s] >= cfg.skLow) continue; title(ws, r++, `${c.name} — ${L.weakBy(s)}`, 7); headRow(ws, r++, [L.code, L.success]); lst.forEach(x => { put(ws, r, 1, x.id); put(ws, r++, 2, x.pct, { fill: '#F8CBCB' }); }); r++; }
  title(ws, r++, L.excellent, 7); headRow(ws, r++, [L.class, L.code, L.total]);
  for (const c of M.classes) c.excellent.forEach(x => { put(ws, r, 1, c.name, { fill: bandFillH(M.nb - 1) }); put(ws, r, 2, x.id, { fill: bandFillH(M.nb - 1), bold: true }); put(ws, r++, 3, x.total, { fill: bandFillH(M.nb - 1) }); });

  // 6 class comparison
  ws = sheet(L.sh.cmp, 0); r = 1; ws.getColumn(1).width = 18;
  for (const G of M.grades) {
    title(ws, r++, L.compareClasses(L.grade(G.grade)), 10);
    headRow(ws, r++, [L.class, L.n, L.mean, L.sd, L.max, L.min, ...M.bandLabels]);
    const m0 = r;
    G.classes.forEach(c => { put(ws, r, 1, c.name, { bold: true }); put(ws, r, 2, c.stats.n); put(ws, r, 3, c.stats.mean, { bold: true }); put(ws, r, 4, c.stats.sd); put(ws, r, 5, c.stats.max); put(ws, r, 6, c.stats.min); c.bandCounts.forEach((k, i) => put(ws, r, 7 + i, k, { fill: k ? bandFillH(i) : undefined })); r++; });
    put(ws, r, 1, L.allGrade, { bold: true, fill: '#F1F3F2' }); put(ws, r, 2, G.stats.n, { bold: true }); put(ws, r, 3, G.stats.mean, { bold: true }); put(ws, r, 4, G.stats.sd); put(ws, r, 5, G.stats.max); put(ws, r, 6, G.stats.min); G.bandCounts.forEach((k, i) => put(ws, r, 7 + i, k, { bold: true })); r++;
    bandCF(ws, `C${m0}:C${r - 1}`, `C${m0}`);
    r++;
    const cg = C.grades[G.grade];
    for (const ch of [cg.means, cg.skillsByClass, cg.bandsByClass, cg.dist].filter(Boolean)) r += addImg(ws, ch, r, 0, 640);
    r += 1;
    const ig = I.grades[G.grade];
    r = bullets(ws, r, L.insightsTitle, [...ig.means, ...ig.skills, ...ig.bands], 10);
  }

  // 7 grade comparison
  if (M.grades.length > 1) {
    ws = sheet(L.sh.cmpG, 0); r = 1; ws.getColumn(1).width = 30;
    title(ws, r++, L.compareGrades, 8);
    ws.mergeCells(r, 1, r, 8); ws.getCell(r, 1).value = L.compareNote; ws.getCell(r, 1).font = { italic: true, name: 'Arial', color: { argb: 'FF6B7A82' } }; r += 2;
    headRow(ws, r++, [L.grade_, L.n, L.mean, L.sd, ...M.bandLabels]); const g0 = r;
    M.grades.forEach(G => { put(ws, r, 1, L.grade(G.grade), { bold: true }); put(ws, r, 2, G.stats.n); put(ws, r, 3, G.stats.mean, { bold: true }); put(ws, r, 4, G.stats.sd); G.bandCounts.forEach((k, i) => put(ws, r, 5 + i, `${k} (${Math.round(k / Math.max(1, G.stats.n) * 100)}%)`, { fill: k ? bandFillH(i) : undefined })); r++; });
    bandCF(ws, `C${g0}:C${r - 1}`, `C${g0}`); r++;
    if (M.commonSkills.length) { headRow(ws, r++, [L.skill, ...M.grades.map(G => L.grade(G.grade))]); const s0 = r; M.commonSkills.forEach(s => { put(ws, r, 1, s, { left: true, wrap: true }); M.grades.forEach((G, i) => put(ws, r, 2 + i, G.skillPct[s])); r++; }); skillCF(ws, `B${s0}:${colA(M.grades.length)}${r - 1}`, `B${s0}`); r++; }
    for (const ch of [C.cross.means, C.cross.bands, C.cross.skills].filter(Boolean)) r += addImg(ws, ch, r, 0, 640);
    r = bullets(ws, r + 1, L.insightsTitle, [...I.cross.means, ...I.cross.bands, ...I.cross.skills], 8);
  }

  // 8 insights & recommendations
  ws = sheet(L.sh.recs, 0); for (let i = 1; i <= 8; i++) ws.getColumn(i).width = 14; r = 1;
  r = bullets(ws, r, L.topFindings, I.summary, 8);
  for (const c of M.classes) { const ic = I.classes[c.name]; r = bullets(ws, r, `${L.classSection(c.name)} — ${L.insightsTitle}`, [...ic.dist, ...ic.skills, ...ic.focus], 8); }
  title(ws, r++, L.skillPlans, 8); r++;
  for (const [s, plan] of Object.entries(I.skillPlans)) r = bullets(ws, r, s, plan, 8);
  for (const [k, lab] of [['teacher', L.forTeacher], ['low', L.forLow], ['excellent', L.forExc], ['staff', L.forStaff], ['admin', L.forAdmin]]) r = bullets(ws, r, lab, I.general[k], 8);

  wb.eachSheet(s => { s.pageSetup = { orientation: 'landscape', fitToPage: true, fitToWidth: 1, fitToHeight: 0, paperSize: 9 }; s.headerFooter = { oddFooter: '&C' + cfg.footer }; });
  const buf = await wb.xlsx.writeBuffer();
  return new Blob([buf], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
